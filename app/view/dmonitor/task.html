{extend name="common/layout" /}
{block name="title"}容灾切换策略{/block}
{block name="main"}
<style>
.dm-stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.dm-stat{flex:1 1 150px;display:block;padding:10px 14px;background:#f5f6f8;border:1px solid transparent;border-radius:6px;color:#555;text-decoration:none!important}
.dm-stat:hover,.dm-stat.active{border-color:#c9d6e3;color:#555}
.dm-stat>span{font-size:12px}
.dm-stat b{display:block;font-size:22px;font-weight:500;color:#333;line-height:1.35}
.dm-stat b.dm-danger{color:#c9302c}.dm-stat b.dm-warning{color:#b45309}
.dm-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dm-toolbar input[name=kw]{flex:1 1 160px;min-width:140px}
.dm-toolbar select{width:auto}
#dm-list .fixed-table-toolbar .bs-bars{float:none;width:100%}
#dm-list .bootstrap-table .fixed-table-container{border:none}
#dm-list .table{margin-bottom:0}
#dm-list .table>thead>tr>th{border-bottom:1px solid #eef0f2;color:#555;font-size:12px;font-weight:400}
#dm-list .table>tbody>tr>td{border-top:1px solid #eef0f2;vertical-align:middle;font-size:13px;padding:8px 10px}
#dm-list .table>tbody>tr.dm-group>td{background:#f5f6f8;border-top:12px solid #fff;padding:9px 12px;font-size:14px}
#dm-list .table>tbody>tr.dm-group:first-child>td{border-top:none}
.dm-group .fa-globe{color:#666;margin-right:6px}
.dm-group b{font-weight:600;margin-right:8px}
.dm-meta{color:#555;font-size:12px;margin-right:6px}
.dm-isp{display:inline-flex;align-items:center;gap:5px;padding:0 9px 0 6px;border-radius:9px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.dm-isp>img{width:14px;height:14px;object-fit:contain;display:block}
.dm-isp-mobile{background:#e3f1fa;color:#00578f}
.dm-isp-telecom{background:#e6ecf7;color:#173a7a}
.dm-isp-unicom{background:#fde7e9;color:#a8000d}
.dm-isp-other{background:#eceef1;color:#3d4148;padding-left:9px}
.dm-tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:3px;font-size:12px;line-height:18px;white-space:nowrap;font-family:inherit}
.dm-tag-red{background:#d32f2f;color:#fff}
.dm-tag-orange{background:#c2410c;color:#fff}
.dm-tag-blue{background:#1d4ed8;color:#fff}
.dm-tag-amber{background:#fde68a;color:#713f12}
.dm-tag-gray{background:#e5e7eb;color:#374151}
.dm-mono{font-family:Menlo,Consolas,monospace;white-space:nowrap}
/* 两行排版：第一行主要信息，第二行次要信息，各列行高一致 */
.dm-l1,.dm-l2{display:flex;align-items:center;min-height:18px;line-height:18px;white-space:nowrap}
.dm-l1{font-size:13px;color:#1f2329}
.dm-l2{font-size:12px;color:#555;margin-top:3px}
.dm-k{flex:none;width:16px;height:16px;margin-right:6px;border-radius:3px;font-size:11px;font-weight:400;line-height:16px;text-align:center;font-family:inherit;background:#eceef1;color:#444}
.dm-main .dm-mono{font-weight:700}
.dm-live .dm-k{background:#1f4e8c;color:#fff}
.dm-backup.dm-live{color:#b42318;font-weight:600}
.dm-backup.dm-live .dm-k{background:#c2410c}
.dm-main.dm-idle{color:#6b7280}
.dm-rr{color:#555;margin-right:6px;font-weight:400}
.dm-extra{margin-left:6px;font-size:11px;color:#555;font-weight:400}
.dm-sep{margin:0 5px;color:#9aa0a6}
.dm-flap{color:#b45309}
.dm-more{color:#555;padding:2px 8px;font-size:16px}
.dm-more:hover{color:#333}
#dm-list td .dropdown-menu{font-size:13px;min-width:120px}
@media (min-width:768px){#dm-list .fixed-table-body{overflow:visible}}
</style>
<div class="modal" id="modal-batchedit">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title">批量改参数</h4>
			</div>
			<div class="modal-body">
				<form id="form-batchedit" onsubmit="return false;" class="form-horizontal">
					<p class="help-block" style="margin-top:0">已选择 <b id="batchedit-count">0</b> 个策略。留空的参数不修改；不适用的策略会自动跳过（如 TCP 端口和代理只修改 TCP 检测的策略）。</p>
					<div class="form-group">
						<label class="col-sm-4 control-label">检测间隔</label>
						<div class="col-sm-6"><div class="input-group"><input type="number" min="1" class="form-control" name="frequency" placeholder="不修改"><span class="input-group-addon">秒</span></div></div>
					</div>
					<div class="form-group">
						<label class="col-sm-4 control-label">确认次数</label>
						<div class="col-sm-6"><input type="number" min="1" class="form-control" name="cycle" placeholder="不修改（条件开启策略不适用）"></div>
					</div>
					<div class="form-group">
						<label class="col-sm-4 control-label">最大超时时间</label>
						<div class="col-sm-6"><div class="input-group"><input type="number" min="1" class="form-control" name="timeout" placeholder="不修改"><span class="input-group-addon">秒</span></div></div>
					</div>
					<div class="form-group">
						<label class="col-sm-4 control-label">TCP检测端口</label>
						<div class="col-sm-6"><input type="number" min="1" max="65535" class="form-control" name="tcpport" placeholder="不修改"></div>
					</div>
					<div class="form-group">
						<label class="col-sm-4 control-label">TCP代理</label>
						<div class="col-sm-6"><select class="form-control" name="tcp_proxy_id">
							<option value="">不修改</option>
							<option value="0">无代理</option>
							{foreach $proxies as $p}<option value="{$p.id}">{$p.name} ({$p.proxy_server}:{$p.proxy_port})</option>{/foreach}
						</select></div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				<button type="button" class="btn btn-primary" onclick="submitBatchEdit()">确定</button>
			</div>
		</div>
	</div>
</div>
<div class="row">
	<div class="col-xs-12 center-block" style="float: none;">
	<div class="panel panel-default panel-intro">
	<div class="panel-body" id="dm-list">

<div class="dm-stats">
	<a href="javascript:statFilter('')" class="dm-stat" data-state="" title="点击查看全部策略"><span>运行中 / 全部</span><b><span id="stat-running">-</span> / <span id="stat-total">-</span></b></a>
	<a href="javascript:statFilter('abnormal')" class="dm-stat" data-state="abnormal" title="当前已切换到备用记录、已暂停解析或检测异常的策略"><span>当前在备用 / 暂停</span><b id="stat-abnormal" class="dm-danger">-</b></a>
	<a href="javascript:statFilter('flap')" class="dm-stat" data-state="flap"><span id="stat-flap-label">7天内频繁抖动</span><b id="stat-flap" class="dm-warning">-</b></a>
	<a href="javascript:cleanOrphan()" class="dm-stat" title="已删除策略遗留的切换记录，点击清理"><span>孤儿日志 <i class="fa fa-trash-o"></i></span><b id="stat-orphan">-</b></a>
</div>

<form onsubmit="return searchSubmit()" method="GET" class="dm-toolbar" id="searchToolbar">
	<input type="hidden" name="type" value="0">
	<input type="text" class="form-control" name="kw" placeholder="ly.cm / 123.253.227.22">
	<select name="state" class="form-control" onchange="searchSubmit()">
		<option value="">全部状态</option>
		<option value="abnormal">在备用 / 暂停</option>

		<ul class="dropdown-menu dropdown-menu-right"><li><a href="javascript:operation('open')">开启运行</a></li><li><a href="javascript:operation('close')">停止运行</a></li><li><a href="javascript:operation('retry')">立即重试</a></li><li role="separator" class="divider"></li><li><a href="javascript:operation('delete')">删除</a></li></ul>
	</div>
</form>

      <table id="listTable">
	  </table>
    </div>
  </div>
</div>
</div>

<script src="/static/js/layer/layer.js"></script>

<script>
// 运营商标签：品牌色 + logo，图标位于 /static/images/isp/
const ISPS = {
	mobile: {name: '移动', logo: 'mobile.svg'},
	telecom: {name: '电信', logo: 'telecom.svg'},
	unicom: {name: '联通', logo: 'unicom.svg'},
};
const ISP_CODES = {cm: 'mobile', yd: 'mobile', ct: 'telecom', dx: 'telecom', cu: 'unicom', lt: 'unicom'};

function esc(value){
	return $('<div>').text(value == null ? '' : String(value)).html();
}
// 主机记录末段为运营商简写（如 ly.cm）时按前缀分组并以运营商作为线路，其余按主域名分组
function hostParts(row){
	var labels = String(row.rr).split('.');
	var isp = labels.length > 1 ? ISP_CODES[labels[labels.length - 1].toLowerCase()] : null;
	var prefix = isp ? labels.slice(0, -1).join('.') : '';
	return {
		key: row.did + '|' + prefix,
		title: (prefix ? prefix + '.' : '') + row.domain,
		isp: isp,
		line: isp ? ISPS[isp].name : (row.linename || '默认'),
		showRr: !isp,
	};
}
function stateText(row){
	if(row.status == 0) return row.type == 3 ? '未开启解析' : '正常';
	if(row.type == 1) return '已暂停解析';
	if(row.type == 2) return '已切换备用';
	if(row.type == 3) return '已开启解析';
	return '检测异常';
}
function lineTag(row){
	var host = hostParts(row);
	var tip = row.rr + '.' + row.domain + '（ID ' + row.id + '）\nDNS线路：' + (row.linename || '-') + '\n状态：' + stateText(row) + (row.active == 1 ? '' : '，已停止运行');
	if(host.isp) return '<span class="dm-isp dm-isp-' + host.isp + '" title="' + esc(tip) + '"><img src="/static/images/isp/' + ISPS[host.isp].logo + '" alt="">' + ISPS[host.isp].name + '</span>';
	return '<span class="dm-isp dm-isp-other" title="' + esc(tip) + '">' + esc(host.line) + '</span>';
}
// 当前状态标签，仅在非正常状态时显示：已暂停/检测异常为红色，已切换备用为橙色
function stateTags(row){
	if(recordDeleted(row)) return '<span class="dm-tag dm-tag-red" title="解析记录已删除，策略已停止，请修改策略重新选择解析记录">记录已删除</span>';
	if(row.status != 1) return '';
	if(row.type == 1) return '<span class="dm-tag dm-tag-red">已暂停</span>';
	if(row.type == 2) return '<span class="dm-tag dm-tag-orange">已切备用</span>';
	if(row.type == 3) return '<span class="dm-tag dm-tag-blue">已开启</span>';
	return '<span class="dm-tag dm-tag-red">检测异常</span>';
}
// 无备用记录的策略在第二行说明切换方式
function typeText(row){
	if(row.type == 1) return '故障时暂停解析';
	if(row.type == 3) return '同域名正常 ≤ ' + esc(row.cycle) + ' 条时开启解析';
	return '仅告警，不修改解析';
}
function recordDeleted(row){
	try { return !!JSON.parse(row.recordinfo || '{}').RecordDeleted; } catch(e) { return false; }
}
function twoLines(l1, l2, tip){
	return '<div' + (tip ? ' title="' + esc(tip) + '"' : '') + '><div class="dm-l1">' + l1 + '</div><div class="dm-l2">' + l2 + '</div></div>';
}
function urlHost(url){
	try { return new URL(url).host; } catch(e) { return url; }
}

$(document).ready(function(){
	updateToolbar();
	updateStatActive();
	loadStats();
	const pageSizeKey = 'dmtask_pagesize';
	const pageNumber = typeof window.$_GET['pageNumber'] != 'undefined' ? parseInt(window.$_GET['pageNumber']) : 1;
	const pageSize = getStoredPageSize(pageSizeKey);

	$("#listTable").bootstrapTable({
		url: '/dmonitor/task/data',
		pageNumber: pageNumber,
		pageSize: pageSize,
		classes: 'table table-hover',
		showColumns: false,
		showToggle: false,
		showFullscreen: false,
		queryParams: function(params) {
			params = $.fn.bootstrapTable.custom.queryParams(params);
			// 状态筛选转换为接口参数
			var state = params.state;
			delete params.state;
			delete params.sortName;
			delete params.sortOrder;
			params.status = state == 'abnormal' ? 1 : '';
			params.active = state == 'running' ? 1 : (state == 'inactive' ? 0 : '');
			params.flap = state == 'flap' ? 1 : '';
			params.group = 1;
			return params;
		},
		columns: [
			{
				field: '',
				checkbox: true
			},
			{
				field: 'linename',
				title: '线路',
				formatter: function(value, row, index) {
					return twoLines(lineTag(row), 'ID ' + row.id);
				}
			},
			{
				field: 'main_value',
				title: '主值 / 备用',
				formatter: function(value, row, index) {
					// 第一行主值（加粗），第二行备用值或切换方式；当前生效的一行标签填充高亮
					var rr = hostParts(row).showRr ? '<span class="dm-rr">' + esc(row.rr) + '</span>' : '';
					var hasBackup = row.type == 2;
					var onBackup = hasBackup && row.status == 1;
					var mainState = '';
					if(hasBackup) mainState = onBackup ? ' dm-idle' : ' dm-live';
					else if((row.type == 1 && row.status == 1) || (row.type == 3 && row.status == 0)) mainState = ' dm-idle';
					var mainTip = hasBackup ? (onBackup ? '主值（当前未生效）' : '主值（当前生效）') : '解析记录值';
					var html = '<div class="dm-l1 dm-main' + mainState + '" title="' + mainTip + '"><span class="dm-k">主</span>' + rr + '<span class="dm-mono">' + esc(value) + '</span>' + stateTags(row) + '</div>';
					if(hasBackup){
						var backup = esc(row.backup_value);
						if(backup.length > 28) backup = '<span title="' + backup + '">' + backup.substring(0, 24) + '…</span>';
						var extra = '';
						if(row.cname_flatten == 1) extra += '<span class="dm-extra" title="切换时将备用CNAME展平为A记录">展平</span>';
						if(row.cdn == 1) extra += '<span class="dm-extra" title="切换时开启Cloudflare代理">CF代理</span>';
						html += '<div class="dm-l2 dm-backup' + (onBackup ? ' dm-live' : '') + '" title="' + (onBackup ? '备用（当前生效）' : '备用（故障时切换）') + '"><span class="dm-k">备</span><span class="dm-mono">' + backup + '</span>' + extra + '</div>';
					}else{
						html += '<div class="dm-l2"><span class="dm-k" style="visibility:hidden">备</span>' + typeText(row) + '</div>';
					}
					return html;
				}
			},
			{
				field: 'checktype',
				title: '检测目标 / 代理',
				formatter: function(value, row, index) {
					if(row.type > 2) return twoLines('无需检测', '按同域名暂停策略的状态判断');
					var target;
					if(value == 1) target = 'TCP ' + (row.checkurl ? esc(row.checkurl) + ':' : '') + esc(row.tcpport);
					else if(value == 2) target = 'HTTP(S) ' + esc(urlHost(row.checkurl));
					else target = 'PING' + (row.checkurl ? ' ' + esc(row.checkurl) : '');
					var via;
					if(value == 1) via = row.proxy_name ? '<i class="fa fa-random" style="margin-right:4px"></i>' + esc(row.proxy_name) : '直连';
					else if(value == 2) via = row.proxy == 1 ? '代理' : '直连';
					else via = '直连';
					var sep = '<span class="dm-sep">·</span>';
					var l2 = via + sep + '每' + row.frequency + '秒' + (value > 0 ? sep + '超时' + row.timeout + '秒' : '');
					var tip = (value == 2 ? row.checkurl + '\n' : '') + '上次检测：' + row.checktimestr;
					return twoLines(target, l2, tip);
				}
			},
			{
				field: 'errcount',
				title: '连续失败 / 阈值',
				formatter: function(value, row, index) {
					if(row.active != 1) return twoLines('—', '未运行');
					if(row.type > 2) return twoLines('—', '无需检测');
					var count = parseInt(value) || 0;
					var l1 = '<span class="' + (count > 0 ? 'dm-flap' : '') + '">' + count + ' / ' + row.cycle + '</span>';
					var tip = row.status == 1 ? '连续检测成功次数，达到阈值后恢复' : '连续检测失败次数，达到阈值后切换';
					return twoLines(l1, row.status == 1 ? '恢复确认' : '连续失败', tip);
				}
			},
			{
				field: 'switch_count',
				title: '7天切换 / 最近',
				formatter: function(value, row, index) {
					var l1;
					if(row.flapping == 1) l1 = '<a href="/dmonitor/task/info/' + row.id + '" class="dm-flap" title="切换频繁，点击查看切换日志">' + value + ' 次</a>';
					else if(value == 0) l1 = '0 次';
					else l1 = '<a href="/dmonitor/task/info/' + row.id + '" title="查看切换日志">' + value + ' 次</a>';
					var last = row.switchtime > 0 ? '最近 ' + esc(row.switchtimestr.substring(5, 16)) : '从未切换';
					return twoLines(l1, last, row.switchtime > 0 ? '最近切换：' + row.switchtimestr : '');
				}
			},
			{
				field: 'active',
				title: '运行',
				formatter: function(value, row, index) {
					var checked = value == 1;
					return '<div class="material-switch" title="' + (checked ? '运行中，点击停止' : '已停止，点击开启') + '"><input id="active' + row.id + '" type="checkbox"' + (checked ? ' checked' : '') + ' onchange="setActive(' + row.id + ',' + (checked ? 0 : 1) + ')"/><label for="active' + row.id + '" class="label-primary"></label></div>';
				}
			},
			{
				field: 'action',
				title: '操作',
				align: 'right',
				formatter: function(value, row, index) {
					var html = '<div class="dropdown"><a href="javascript:;" class="dm-more" data-toggle="dropdown" aria-label="更多操作"><i class="fa fa-ellipsis-h"></i></a><ul class="dropdown-menu dropdown-menu-right">';
					html += '<li><a href="/dmonitor/task/info/' + row.id + '"><i class="fa fa-history fa-fw"></i> 切换日志</a></li>';
					html += '<li><a href="/dmonitor/task/edit?id=' + row.id + '"><i class="fa fa-pencil fa-fw"></i> 修改</a></li>';
					html += '<li><a href="/dmonitor/task/add?copy=' + row.id + '"><i class="fa fa-copy fa-fw"></i> 复制</a></li>';
					html += '<li><a href="/record/' + row.did + '?subdomain=' + encodeURIComponent(row.rr) + '" target="_blank"><i class="fa fa-external-link fa-fw"></i> 查看解析</a></li>';
					html += '<li role="separator" class="divider"></li>';
					html += '<li><a href="javascript:delItem(\'' + row.id + '\')" class="text-danger"><i class="fa fa-trash fa-fw"></i> 删除</a></li>';
					return html + '</ul></div>';
				}
			},
		],
		onPostBody: function(data) {
			renderGroups(data);
		},
		onPageChange: function(number, size){
			setStoredPageSize(pageSizeKey, size);
		},
	})
})
// 在每组第一条策略前插入分组标题行
function renderGroups(data){
	var $table = $('#listTable');
	var $rows = $table.find('tbody > tr[data-index]');
	if(!data.length || !$rows.length) return;
	var colspan = $rows.eq(0).children('td').length;
	var start = 0;
	for(var i = 1; i <= data.length; i++){
		if(i < data.length && hostParts(data[i]).key == hostParts(data[start]).key) continue;
		var group = data.slice(start, i);
		var host = hostParts(group[0]);
		var lines = {}, records = {}, multiCheck = false, flapping = false;
		group.forEach(function(row){
			lines[hostParts(row).line] = true;
			if(records[row.recordid]) multiCheck = true;
			records[row.recordid] = true;
			if(row.flapping == 1) flapping = true;
		});
		var meta = group.length + ' 条策略';
		var lineCount = Object.keys(lines).length;
		if(multiCheck) meta += ' · 同记录多检测点';
		else if(lineCount > 1) meta += ' · ' + lineCount + ' 条线路';
		var html = '<tr class="dm-group"><td colspan="' + colspan + '"><input type="checkbox" class="dm-group-check" data-start="' + start + '" data-end="' + i + '" title="勾选本组全部策略" style="margin:0 10px 0 0;vertical-align:-2px"><i class="fa fa-globe"></i><b>' + esc(host.title) + '</b><span class="dm-meta">' + meta + '</span>';
		if(flapping) html += '<span class="dm-tag dm-tag-amber" style="margin-left:0">抖动</span>';
		html += '</td></tr>';
		$rows.eq(start).before(html);
		start = i;
	}
}
$(document).on('change', '#listTable .dm-group-check', function(){
	var method = this.checked ? 'check' : 'uncheck';
	for(var i = $(this).data('start'); i < $(this).data('end'); i++){
		$('#listTable').bootstrapTable(method, i);
	}
});
function loadStats(){
	$.post('/dmonitor/task/stats', {}, function(res){
		if(res.code != 0) return;
		var d = res.data;
		$('#stat-total').text(d.total);
		$('#stat-running').text(d.running);
		$('#stat-abnormal').text(d.abnormal);
		$('#stat-flap').text(d.flap);
		$('#stat-orphan').text(d.orphan);
		$('#stat-flap-label').text(d.flap_days + '天内频繁抖动').parent().attr('title', d.flap_days + '天内切换≥' + d.flap_threshold + '次的策略');
	}, 'json');
}
function updateStatActive(){
	var state = $('select[name=state]').val();
	$('.dm-stat[data-state]').removeClass('active');
	$('.dm-stat[data-state="' + state + '"]').addClass('active');
}
function statFilter(state){
	$('select[name=state]').val(state);
	if(state == '') $('#searchToolbar input[name=kw]').val('');
	searchSubmit();
}
function searchSubmit(){
	updateStatActive();
	$('#listTable').bootstrapTable('selectPage', 1);
	return false;
}
function reloadAll(){
	loadStats();
	searchRefresh();
}
function cleanOrphan(){
	layer.confirm('确定清理已删除策略遗留的切换记录吗？', {
		btn: ['确定','取消']
	}, function(){
		$.post('/dmonitor/clean', {orphan: 1}, function(data){
			if(data.code == 0) {
				layer.msg(data.msg, {icon: 1});
				loadStats();
			} else {
				layer.msg(data.msg, {icon: 2});
			}
		}, 'json');
	});
}
function setActive(id, active){
	$.post('/dmonitor/task/setactive', {id: id, active: active}, function(data){
		if(data.code == 0) {
			layer.msg('修改成功', {icon: 1, time:800});
			reloadAll();
		} else {
			layer.alert(data.msg, {icon: 2});
			searchRefresh();
		}
	}, 'json');
}
function delItem(id){
	layer.confirm('确定要删除此切换策略吗？', {
		btn: ['确定','取消']
	}, function(){
		$.post('/dmonitor/task/del', {id: id}, function(data){
			if(data.code == 0) {
				layer.msg('删除成功', {icon: 1, time:800});
				reloadAll();
			} else {
				layer.msg(data.msg, {icon: 2});
			}
		}, 'json');
	});
}
function selectedIds(){
	var rows = $("#listTable").bootstrapTable('getSelections');
	var ids = [];
	for(var i in rows){
		ids.push(rows[i].id);
	}
	return ids;
}
function batchEdit(){
	var ids = selectedIds();
	if(ids.length == 0){
		layer.msg('请先勾选要修改的策略');
		return;
	}
	$('#form-batchedit')[0].reset();
	$('#batchedit-count').text(ids.length);
	$('#modal-batchedit').modal('show');
}
function submitBatchEdit(){
	var ids = selectedIds();
	var data = {ids: ids};
	var hasChange = false;
	$('#form-batchedit').find(':input[name]').each(function(){
		data[$(this).attr('name')] = $(this).val();
		if($(this).val() !== '') hasChange = true;
	});
	if(!hasChange){
		layer.msg('请至少填写一项要修改的参数');
		return;
	}
	var ii = layer.load(2);
	$.ajax({
		type : 'POST',
		url : '/dmonitor/task/batchedit',
		data : data,
		dataType : 'json',
		success : function(res) {
			layer.close(ii);
			if(res.code == 0){
				$('#modal-batchedit').modal('hide');
				layer.alert(res.msg, {icon: 1});
				reloadAll();
			}else{
				layer.alert(res.msg, {icon: 2});
			}
		},
		error: function(){
			layer.close(ii);
			layer.msg('服务器错误');
		}
	});
}
function operation(action){
	var ids = selectedIds();
	if(ids.length == 0){
		layer.msg('请先勾选要操作的策略');
		return;
	}
	if(action == 'delete'){
		if(!confirm('确定要删除所选策略吗？')) return;
	}

	var ii = layer.load(2);
	$.ajax({
		type : 'POST',
		url : '/dmonitor/task/operation',
		data : {act: action, ids: ids},
		dataType : 'json',
		success : function(data) {
			layer.close(ii);
			if(data.code == 0){
				layer.closeAll();
				layer.alert(data.msg, {icon: 1});
				reloadAll();
			}else{
				layer.alert(data.msg, {icon: 2});
			}
		}
	});
}
</script>
{/block}
